server:
  port: 8080

spring:
  profiles:
    active: dev   # remove or change to "prod" before deploying
  application:
    name: cms-backend
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 200MB
  datasource:
    url: jdbc:sqlserver://${SQL_SERVER_HOST:127.0.0.1}:${SQL_SERVER_PORT:1433};databaseName=${SQL_DB_NAME:virtualcoach};encrypt=true;trustServerCertificate=true
    username: ${SQL_USERNAME:appuser}
    password: ${SQL_PASSWORD:test@1234}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: update
    show-sql: false

app:
  storage:
    type: ${APP_STORAGE_TYPE:local}
    local-path: ${APP_STORAGE_PATH:./storage}
  gcs:
    bucket-name: ${GCS_BUCKET_NAME:pitch-perfect-assets}
    audio-prefix: audio/
    slides-prefix: slides/
  supported-locales: en,hi,ta,te,mr,bn

azure:
  openai:
    endpoint: ${AZURE_OPENAI_ENDPOINT:https://pitchperfectllmengine2.openai.azure.com/}
    deployment-name: ${AZURE_OPENAI_DEPLOYMENT:gpt-4o}
    api-version: 2024-02-15-preview

elevenlabs:
  model: eleven_multilingual_v2
  default-voice-id: ${ELEVENLABS_VOICE_ID:pNInz6obpgDQGcFmaJgB}
  stability: 0.50          # global fallback — overridden per locale below
  similarity-boost: 0.75

  # ── Per-locale voice IDs ────────────────────────────────────────────────────
  # Browse https://elevenlabs.io/voice-library and filter by language to find
  # a native or multilingual voice that sounds natural for each locale.
  # The IDs below are a sensible starting point using multilingual voices.
  locale-voices:
    en: pNInz6obpgDQGcFmaJgB   # Adam — standard English voice
    # Hindi — native Indian accent voices (all work with eleven_multilingual_v2):
    #   Ruhaan  zs7UfyHqCCmny7uTxCYi  Clear Hindi Narration, male   ← active
    #   Raju    eyVoIoi3vo6sJoHOKgAc  Clear, Natural & Warm, male
    #   Anika   RABOvaPec1ymXz02oDQi  Sweet & Lively, female
    #   Monika  VZyYADHcMi33m0wO9zD1  Calm & Natural, female
    hi: JBFqnCBsd6RMkjVDRZzb   # Ruhaan — Clear Hindi Narration Voice (Indian accent)
    ta: 21m00Tcm4TlvDq8ikWAM   # Rachel — multilingual; swap for Tamil-native
    te: AZnzlk1XvdvUeBnXmlld   # Domi   — multilingual; swap for Telugu-native
    mr: EXAVITQu4vr4xnSDxMaL   # Bella  — multilingual; swap for Marathi-native
    bn: MF3mGyEYCl7XYWbV9V6O   # Elli   — multilingual; swap for Bengali-native

  # ── Per-locale stability (0.0 = expressive/varied, 1.0 = flat/robotic) ──────
  # Indian languages need lower stability than English to avoid robotic prosody.
  locale-stability:
    en: 0.50
    hi: 0.30
    ta: 0.30
    te: 0.30
    mr: 0.30
    bn: 0.30

  # ── Per-locale style exaggeration (0.0 = neutral, 1.0 = highly expressive) ──
  # A small non-zero value adds natural intonation to Indian language TTS.
  locale-style:
    en: 0.00
    hi: 0.15
    ta: 0.15
    te: 0.15
    mr: 0.15
    bn: 0.15

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.pitchperfect: DEBUG
