server:
  port: 8081

spring:
  application:
    name: mobile-backend
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=virtualcoach;encrypt=true;trustServerCertificate=true
    username: appuser
    password: YourStrong@Passw0rd
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

app:
  gcs:
    bucket-name: ${GCS_BUCKET_NAME:pitch-perfect-assets}
    audio-prefix: audio/
  storage:
    local-path: ${APP_STORAGE_PATH:./storage}
  gemini:
    api-key: ${GEMINI_API_KEY:YOUR_GEMINI_API_KEY}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    model: ${GEMINI_MODEL:gemini-1.5-flash}
  rag:
    max-context-faqs: 5
    similarity-threshold: 0.75

azure:
  openai:
    endpoint: ${AZURE_OPENAI_ENDPOINT:https://pitchperfectllmengine2.openai.azure.com/}
    key: ${AZURE_OPENAI_KEY:YOUR_AZURE_OPENAI_KEY}
    deployment-name: ${AZURE_OPENAI_DEPLOYMENT:gpt-4o}
    api-version: 2024-02-15-preview
  speech:
    key: ${AZURE_SPEECH_KEY:YOUR_AZURE_SPEECH_KEY}
    region: ${AZURE_SPEECH_REGION:centralindia}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.pitchperfect: DEBUG
